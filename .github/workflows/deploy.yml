name: Deploy worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to CF?'
        required: true
        type: boolean
        default: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gate:
    runs-on: ubuntu-slim
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        shell: bash
        run: |
          msg=$(echo "${{ github.event.head_commit.message }}" | tail -n 1)
          if [[ "${{ github.event_name }}" == "push" && "$msg" =~ ^Deploy ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DEPLOY" == "true" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DEPLOY: ${{ inputs.deploy }}

  deploy:
    needs: [ci, gate]
    if: needs.gate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy | grep -Ev "https"
