name: Repair public app string

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'patch/ci-wrangler'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Repair string escaping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/public-app.js')
          text = path.read_text(encoding='utf-8')
          old = """    const quoteOpen = String.fromCharCode(0x201c);
    const quoteClose = String.fromCharCode(0x201d);
    const separator = String.fromCharCode(0x00b7);
"""
          new = """    const quoteOpen = String.fromCharCode(0x201c);\\n    const quoteClose = String.fromCharCode(0x201d);\\n    const separator = String.fromCharCode(0x00b7);\\n"""
          count = text.count(old)
          if count != 1:
              if count == 0:
                  raise SystemExit('Malformed block not found; source may already be repaired.')
              raise SystemExit(f'Expected one malformed block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify source
        run: node --check src/public-app.js

      - name: Remove repair workflow
        run: rm .github/workflows/fix-public-app-string.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public-app.js .github/workflows/fix-public-app-string.yml
          git commit -m "fix: repair public app string escaping"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
