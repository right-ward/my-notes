name: Repair public app string

on:
  push:
    branches:
      - patch/ci-wrangler

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: patch/ci-wrangler

      - name: Repair string escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/public-app.js')
          text = path.read_text(encoding='utf-8')
          old = """    const quoteOpen = String.fromCharCode(0x201c);
    const quoteClose = String.fromCharCode(0x201d);
    const separator = String.fromCharCode(0x00b7);
"""
          new = """    const quoteOpen = String.fromCharCode(0x201c);\\n    const quoteClose = String.fromCharCode(0x201d);\\n    const separator = String.fromCharCode(0x00b7);\\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one malformed block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify the repaired source
        run: |
          node --check src/worker.js
          node --check src/notes.js
          node --check src/style.js
          node --check src/public-app.js

      - name: Remove repair workflow
        run: rm .github/workflows/fix-public-app-string.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public-app.js .github/workflows/fix-public-app-string.yml
          git commit -m "fix: repair public app string escaping"
          git push origin HEAD:patch/ci-wrangler
