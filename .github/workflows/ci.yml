name: CI

# Validate JavaScript modules and the Wrangler deployment bundle.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check standalone JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/worker.js src/notes.js src/style.js src/shells.js src/manage-export.js src/version.js; do
            node --check "$file"
          done

      - name: Check application version source
        run: |
          test "$(node -p "require('./package.json').version")" = "$(node -e "import('./src/version.js').then(({ APP_VERSION }) => process.stdout.write(APP_VERSION))")"

      - name: Validate Wrangler build
        run: npx --yes wrangler@latest deploy --dry-run
