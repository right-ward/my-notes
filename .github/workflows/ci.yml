name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Repair generated public app string
        if: github.event_name == 'pull_request' && github.head_ref == 'patch/ci-wrangler'
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/public-app.js')
          text = app.read_text(encoding='utf-8')
          old = """    const quoteOpen = String.fromCharCode(0x201c);
    const quoteClose = String.fromCharCode(0x201d);
    const separator = String.fromCharCode(0x00b7);
"""
          new = """    const quoteOpen = String.fromCharCode(0x201c);\\n    const quoteClose = String.fromCharCode(0x201d);\\n    const separator = String.fromCharCode(0x00b7);\\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed block, found {count}')
          app.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check standalone JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/worker.js src/notes.js src/style.js; do
            node --check "$file"
          done
          node --check src/public-app.js

      - name: Validate Wrangler build
        run: npx --yes wrangler@latest deploy --dry-run

      - name: Push repair and restore workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'patch/ci-wrangler'
        run: |
          python - <<'PY'
