name: One-shot source repair

on:
  push:
    branches:
      - patch/ci-wrangler

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: patch/ci-wrangler

      - name: Repair source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/public-app.js')
          text = path.read_text(encoding='utf-8')
          old = """    const quoteOpen = String.fromCharCode(0x201c);
    const quoteClose = String.fromCharCode(0x201d);
    const separator = String.fromCharCode(0x00b7);
"""
          new = "    const quoteOpen = String.fromCharCode(0x201c); const quoteClose = String.fromCharCode(0x201d); const separator = String.fromCharCode(0x00b7);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify source
        run: node --check src/public-app.js

      - name: Restore normal CI
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
            workflow_call:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v7.0.1

                - name: Setup Node
                  uses: actions/setup-node@v7.0.0
                  with:
                    node-version: 24
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Check standalone JavaScript syntax
                  shell: bash
                  run: |
                    set -euo pipefail
                    for file in src/worker.js src/notes.js src/style.js; do
                      node --check "$file"
                    done

                - name: Validate Wrangler build
                  run: npx --yes wrangler@latest deploy --dry-run
          EOF
          rm -f .github/workflows/fix-public-app-string.yml .github/workflows/fix-public-app-encoding.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/public-app.js .github/workflows/ci.yml .github/workflows/fix-public-app-string.yml .github/workflows/fix-public-app-encoding.yml
          git commit -m "fix: repair public app string escaping"
          git push origin HEAD:patch/ci-wrangler
